plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // =========================
    // GSON
    // =========================
    implementation 'com.google.code.gson:gson:2.14.0'

    // =========================
    // ImGui
    // =========================
    implementation platform("org.lwjgl:lwjgl-bom:3.4.3")

    ['', '-opengl', '-glfw'].each {
        implementation "org.lwjgl:lwjgl$it:3.4.3"
        implementation "org.lwjgl:lwjgl$it::natives-linux"
    }

    implementation "io.github.spair:imgui-java-binding:1.92.7.1"
    implementation "io.github.spair:imgui-java-lwjgl3:1.92.7.1"

    implementation "io.github.spair:imgui-java-natives-windows:1.92.7.1"
    implementation "io.github.spair:imgui-java-natives-linux:1.92.7.1"




    // =========================
    // LWJGL
    // =========================
    implementation platform("org.lwjgl:lwjgl-bom:3.4.3")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-assimp"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-nfd"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb:3.4.3"

    runtimeOnly "org.lwjgl:lwjgl:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-assimp:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-glfw:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-nfd:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-openal:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-opengl:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-stb::natives-linux"


    // =========================
    // JOML
    // =========================
    implementation "org.joml:joml:1.10.9"

    // =========================
    // Tests
    // =========================
    testImplementation platform("org.junit:junit-bom:6.0.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}


project.ext.lwjglVersion = "3.4.3"
project.ext.jomlVersion = "1.10.9"
project.ext.lwjglNatives = "natives-linux"
project.ext.imguiVersion = "1.92.7.1"






